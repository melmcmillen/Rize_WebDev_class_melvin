<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JavaScript Basics</title>
    
    <!-- import the webpage's stylesheet -->
    <link rel="stylesheet" href="./style.css">

    <!-- import Bootstrap CSS -->
<div class="container mt-5">

    <div class="question-block mb-4">
    <h4>1. What sounds like the best weekend?</h4>

    <button class="btn btn-primary answer-btn" data-score="3">
        Hiking a mountain
    </button>

    <button class="btn btn-secondary answer-btn" data-score="2">
        Exploring with friends
    </button>

    <button class="btn btn-info answer-btn" data-score="1">
        Relaxing at the beach
    </button>
</div>

    <!-- Question 2 -->
    <div class="question-block mb-4">
    <h4>2. What's your biggest strength?</h4>

    <button class="btn btn-primary answer-btn" data-score="3">
        Leadership
    </button>

    <button class="btn btn-secondary answer-btn" data-score="2">
        Loyalty
    </button>

    <button class="btn btn-info answer-btn" data-score="1">
        Kindness
    </button>
</div>

    <!-- Question 3 -->
    <div class="question-block mb-4">
    <h4>3. Which place would you rather visit?</h4>

    <button class="btn btn-primary answer-btn" data-score="3">
        Safari
    </button>

    <button class="btn btn-secondary answer-btn" data-score="2">
        Forest
    </button>

    <button class="btn btn-info answer-btn" data-score="1">
        Beach
    </button>
</div>

    <!-- Question 4 -->
    <div class="question-block mb-4">
    <h4>4. How do your friends describe you?</h4>

    <button class="btn btn-primary answer-btn" data-score="3">
        Fearless
    </button>

    <button class="btn btn-secondary answer-btn" data-score="2">
        Reliable
    </button>

    <button class="btn btn-info answer-btn" data-score="1">
        Friendly
    </button>
</div>

    <button id="show-results" class="btn btn-success">
        Show Results
    </button>

    <div id="result-container" class="mt-4"></div>

</div>

<script src="script.js"></script>
